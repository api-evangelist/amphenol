domain_standards:
  probed: true
  found: false
  note: >-
    Amphenol's market is electronic interconnect manufacturing, whose interchange standards are
    supply-chain formats rather than web-API standards. No SCIM URN, OData $metadata, OpenRTB,
    Sparkplug topic namespace, ActivityPub actor, OAI-PMH verb, LTI/OneRoster shape, HL7v2, X12,
    EDIFACT or ISO 20022 message type appears in any surface probed. Amphenol's own plans
    artifact records that distributor exchange is bilateral EDI, which would be the place an X12
    or EDIFACT signature could live, but no such contract is published: the exchange is
    partner-private. This is REWARD-ONLY — no domain standard is invented to fill the slot.
  candidates_checked:
    - scim
    - odata
    - x12
    - edifact
    - iso20022
    - sparkplug
