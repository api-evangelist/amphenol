description: >-
  Standards conformance asserted only where a live Amphenol surface demonstrated it. Amphenol
  publishes no compliance or standards page reachable to this run — the corporate host returns
  HTTP 403 at the CDN edge to non-browser clients — so nothing here rests on a marketing claim.
  Where a standard was not met, that is recorded as conforms: false rather than omitted.
conformance:
  - id: oauth2
    name: OAuth 2.0
    conforms: true
    evidence: >-
      amphenol-automotive.com serves a complete authorization-server metadata document with
      issuer, authorization_endpoint, token_endpoint and revocation_endpoint, and its protected
      resource returns HTTP 401 with a WWW-Authenticate-style JSON challenge.
    source: https://amphenol-automotive.com/.well-known/oauth-authorization-server
    status: 200
  - id: rfc8414
    name: 'RFC 8414 — OAuth 2.0 Authorization Server Metadata'
    conforms: true
    evidence: >-
      /.well-known/oauth-authorization-server returns HTTP 200 application/json carrying issuer,
      authorization_endpoint, token_endpoint, response_types_supported, grant_types_supported,
      code_challenge_methods_supported, scopes_supported and
      token_endpoint_auth_methods_supported.
    source: https://amphenol-automotive.com/.well-known/oauth-authorization-server
    status: 200
  - id: rfc9728
    name: 'RFC 9728 — OAuth 2.0 Protected Resource Metadata'
    conforms: true
