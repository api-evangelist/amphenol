description: >-
  Amphenol publishes no API client SDK on any package registry — npm, PyPI, RubyGems, NuGet,
  Maven Central, crates.io and pkg.go.dev all return nothing first-party. What it does publish,
  under its own GitHub organizations, is source-distributed engineering code: Arduino/C++
  drivers for Amphenol Advanced Sensors parts, and C#/Python test-automation libraries from
  Amphenol Borisch Technologies. None of them is a client for an Amphenol web API; they talk to
  hardware. They are recorded here because they are the company's only first-party published
  code, and because their release currency is a real signal.
notes: >-
  CURRENCY: not one of these repositories has ever cut a GitHub release or a tag. There is no
  version number to read anywhere, so every entry carries version: null and published: null
  honestly rather than a guess, with the last commit date recorded separately as the only
  available decay signal. A consumer cloning these gets whatever is on the default branch that
  day and cannot pin.
