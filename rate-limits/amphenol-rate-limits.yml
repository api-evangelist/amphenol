description: >-
  Amphenol documents no rate limits for either of its live API surfaces, and — more usefully for
  an agent — returns no rate-limit signal at runtime either. This supersedes the 2026-05-04 bulk
  sweep entry, which asserted the same absence from prose alone; the absence has now been
  observed on the wire.
limit_count: 0
notes: >-
  A full HTTP 200 response from the Parts Direct Search endpoint carries no X-RateLimit-Limit,
  X-RateLimit-Remaining, X-RateLimit-Reset, RateLimit, RateLimit-Policy or Retry-After header.
  The complete header set returned was Date, Server, X-Robots-Tag, Link, X-Content-Type-Options,
  Access-Control-Expose-Headers, Access-Control-Allow-Headers, Allow, Vary,
  Strict-Transport-Security, X-XSS-Protection, Expect-CT, Referrer-Policy, Transfer-Encoding and
  Content-Type. A client therefore has no way to know how much budget it has, and no way to
  learn a backoff interval except by being cut off. No 429 was provoked and none is documented.
