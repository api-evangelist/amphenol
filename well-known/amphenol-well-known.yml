  recorded as unprobeable by this run.
  amphenol-industrial.com answers HTTP 200 to /.well-known/security.txt with its 222 KB
  WordPress homepage. That is a soft-404 HTML shell, not an RFC 9116 document, and is recorded
  as a miss.
